name: Beta checks and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar a versão de package.json após validar os pacotes
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: beta-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'workflow_dispatch'
        name: Confirm release branch
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npx install-electron
      - run: npm run test:desktop
      - run: npm run test:editorial-desktop
      - if: matrix.platform == 'windows'
        run: npm run test:rich-text-desktop
      - if: matrix.platform == 'windows'
        run: npm run test:timeline-desktop
      - if: matrix.platform == 'windows'
        run: npm run test:chat-desktop
      - if: matrix.platform == 'windows' && github.event_name == 'workflow_dispatch'
        run: npx electron-builder --win portable --x64 --publish never
      - if: matrix.platform == 'macos' && matrix.arch == 'arm64' && github.event_name == 'workflow_dispatch'
        run: npx electron-builder --mac zip --arm64 --publish never
      - if: matrix.platform == 'macos' && matrix.arch == 'x64' && github.event_name == 'workflow_dispatch'
        run: npx electron-builder --mac zip --x64 --publish never
      - if: matrix.platform == 'macos' && github.event_name == 'workflow_dispatch'
        name: Verify signed macOS app and final ZIP
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          app_path="$(find release -maxdepth 2 -type d -name 'Social Media Agent.app' -print -quit)"
          test -n "$app_path"
          bash scripts/verify-macos-package.sh "$app_path" "$EXPECTED_ARCH"
          version="$(node -p "require('./package.json').version")"
          if [ "$EXPECTED_ARCH" = arm64 ]; then
            zip_path="release/Social Media Agent-${version}-arm64-mac.zip"
          else
            zip_path="release/Social Media Agent-${version}-mac.zip"
          fi
          extracted="$(mktemp -d "$RUNNER_TEMP/sma-signed-zip.XXXXXX")"
          ditto -x -k "$zip_path" "$extracted"
          final_app="$extracted/Social Media Agent.app"
          bash scripts/verify-macos-package.sh "$final_app" "$EXPECTED_ARCH"
          node scripts/macos-package-smoke.cjs "$final_app"
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: beta-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 7
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: beta-*
          path: release
          merge-multiple: true
      - name: Verify packages and write checksums
        run: node scripts/verify-release-assets.cjs release
      - if: inputs.publish
        name: Publish beta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A release $tag já existe."
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "A tag $tag já existe."
            exit 1
          fi
          gh release create "$tag" release/* \
            --target "$GITHUB_SHA" \
            --title "Social Media Agent $version" \
            --prerelease --latest=false \
            --notes-file "docs/releases/${version}.md" --generate-notes --fail-on-no-commits
          url="$(gh release view "$tag" --json url --jq .url)"
          echo "Release publicada: $url" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !inputs.publish }}
        name: Dry run summary
        run: echo "Pacotes e checksums validados; nenhuma release foi publicada." >> "$GITHUB_STEP_SUMMARY"
