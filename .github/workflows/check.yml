name: Beta checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npx install-electron
      - if: matrix.platform == 'windows'
        run: npm run test:desktop
      - if: matrix.platform == 'windows'
        run: npm run test:editorial-desktop
      - if: matrix.platform == 'windows'
        run: npm run test:rich-text-desktop
      - if: matrix.platform == 'windows'
        run: npm run test:timeline-desktop
      - if: matrix.platform == 'windows'
        run: npx electron-builder --win portable --x64 --publish never
      - if: matrix.platform == 'windows' && startsWith(github.ref, 'refs/tags/v')
        name: Upload Windows release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Get-ChildItem -LiteralPath release -Filter *.exe -File | ForEach-Object {
            gh release upload $env:GITHUB_REF_NAME $_.FullName --clobber
          }
      - if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        run: npx electron-builder --mac zip --arm64 --publish never
      - if: matrix.platform == 'macos' && matrix.arch == 'x64'
        run: npx electron-builder --mac zip --x64 --publish never
      - if: matrix.platform == 'macos'
        name: Verify macOS 12 minimum version
        shell: bash
        run: |
          app_path="$(find release -maxdepth 2 -type d -name 'Social Media Agent.app' -print -quit)"
          test -n "$app_path"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app_path/Contents/Info.plist")" = "12.0"
      - if: matrix.platform == 'macos' && startsWith(github.ref, 'refs/tags/v')
        name: Upload macOS release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" release/*.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: beta-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.zip
          retention-days: 7
