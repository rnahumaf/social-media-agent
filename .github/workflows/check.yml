name: Beta checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npx install-electron
      - if: matrix.platform == 'windows'
        run: npx electron-builder --win portable --x64 --publish never
      - if: matrix.platform == 'macos' && matrix.arch == 'arm64'
        run: npx electron-builder --mac zip --arm64 --publish never
      - if: matrix.platform == 'macos' && matrix.arch == 'x64'
        run: npx electron-builder --mac zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: beta-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.zip
          retention-days: 7
